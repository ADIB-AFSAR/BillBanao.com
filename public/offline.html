<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Ledger</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f6f3ed; color: #1c1b19;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card { max-width: 380px; text-align: center; }
  .badge {
    display: inline-grid; place-items: center; width: 48px; height: 48px;
    border-radius: 999px; background: rgba(242, 201, 76, 0.2); color: #92650a; margin: 0 auto 16px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #56534c; line-height: 1.55; margin: 0 0 20px; }
  button {
    height: 40px; padding: 0 20px; border-radius: 8px; border: none;
    background: #1c1b19; color: #f6f3ed; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button:active { opacity: .85; }
  a { color: #92650a; font-weight: 500; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      This page hasn't been opened on this device before, so it can't load without a connection.
      Once you've opened <a href="/billing">New Bill</a> at least once while online, it'll keep working with no connection at all.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
